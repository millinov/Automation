- name: Deploying wayshub-frontend app
  hosts: appserver
  tasks:

    - name: Check If Docker Is Installed
      command: docker --version
      register: docker_valid
      ignore_errors: yes

    - name: Debug Docker Output
      debug:
        var: docker_valid 

    - name: If no docker, run install docker
      when: docker_valid.failed
      become: true 
      include_tasks:
        file: ./tasks/install-docker.yml

    - name: If yes docker are running
      when: not docker_valid.failed
      block:

        - name: Copying docker-compose
          copy:
            src: ./misc/docker-compose.yaml
            dest: /home/miral/docker/docker-compose.yaml
            owner: miral
            group: miral
            mode: '644'
        
        - name: Run docker compose
          command: docker compose up -d


