volumes:

  prometheus-data: {}

services:

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    ports:
      - 9090:9090
    stdin_open: true
    volumes:
      - "/home/miral/docker/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "prometheus-data:/prometheus"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    container_name: grafana
    image: grafana/grafana
    ports:
      - 3000:3000